<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SlotMate — Login</title>
 {% load static %}
  <link rel="stylesheet" href="{% static 'css/login.css' %}">

</head>
<script>
function validatePassword(input) {
    input.value = input.value.replace(/[^a-zA-Z0-9]/g, '');

    if (input.value.length > 8) {
        input.value = input.value.slice(0, 8);
    }
}
</script>

<body>

  <div class="bg-glow glow1"></div>
  <div class="bg-glow glow2"></div>
  <div class="bg"></div>

  <div class="login-wrapper">

    <div class="brand-header">
      <div class="logo">SlotMate</div>
      <div class="slogan">Better Slots, Better Semester</div>
    </div>

    <div class="card">

      <h2>Welcome </h2>
      <p class="subtitle">Log in to find your perfect swap match</p>

      <form method="post">
        {% csrf_token %}
      
      <div class="field">
        <label>University Email</label>
       <input type="email" name="email" id="loginEmail" placeholder="xyz@university.edu">
        <small class="error" id="loginEmailError"></small>
      </div>

      <div class="field">
        <label>Password</label>
       <input type="password" name="password" id="loginPassword" placeholder="Max 8 letters/numbers" maxlength="8" oninput="validatePassword(this)">
       <small class="error" id="loginPassError"></small>
      </div>

      <div class="forgot">
        <a href="/forget-password/">Forgot password?</a>
      </div>

      <button class="btn-login" type="submit">Login </button>

      {% if error %}
        <p style="color: red;">{{ error }}</p>
      {% endif %}
      </form>
      
      <div class="divider">or</div>

      <p class="register-link">
        Do not have an account?
        <a href="/register/">Sign Up </a>
      </p>

    </div>

  </div>
   <script src="{% static 'js/login.js' %}"></script>
</body>
</html>
