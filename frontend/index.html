<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SlotMate</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

    <div class="background-glow"></div>

    <nav class="navbar">
        <div class="logo">SlotMate</div>
        <div class="slogan">Better Slots, Better Semester</div>

        <div class="nav-right">
            <span>Dashboard</span>
            <span>Matches</span>
            <span>Profile</span>
        </div>
    </nav>

    <main class="container">

        <section class="hero">
            <h1>Find Your Perfect Class Partner</h1>
            <p>Smart course swapping made simple</p>
        </section>

        <section class="cards-section">
            <div class="card">
                <h3>Swap Snapshot</h3>
                <p>Visual match overview</p>
            </div>

            <div class="card">
                <h3>Graphical Match Insight</h3>
                <p>Compatibility analysis</p>
            </div>
        </section>
